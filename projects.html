<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects</title>
  <link rel="stylesheet" href="./css/style.css" />

  <!-- BabylonJS -->
  <script src="https://preview.babylonjs.com/babylon.js"></script>
  <script src="https://preview.babylonjs.com/Oimo.js"></script>
  <script src="https://preview.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <style>
    .tag-buttons {
      text-align: center;
      margin: 1rem;
    }

    .tag-buttons button {
      margin: 0.3rem;
      padding: 0.5rem 1rem;
      background: #ffffff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .tag-buttons button.active {
      background: #222;
      color: rgb(0, 0, 0);
    }
  </style>


</head>

<body>
  <!-- Shared header/footer -->
  <header></header>
  
  <main>
    <canvas id="canvas"></canvas>
  </main>
  <footer></footer>

  <script type="module">
    import { initializeEngine, createScene } from './js/sceneSetup.js';
    import { setupCamera } from './js/cameraSetup.js';
    import { setupLights } from './js/lightSetup.js';
    import { setupInputControls } from './js/inputControls.js';
    import { loadMeshes } from './js/meshSetup.js';
    import { setupInteractions } from './js/interactions.js';
    //import { loadProjects } from './js/projectLoader.js'; // ✅ NEW

    // Load header & footer
    fetch("header.html").then(res => res.text()).then(data => {
      document.querySelector("header").innerHTML = data;
    });
    fetch("footer.html").then(res => res.text()).then(data => {
      document.querySelector("footer").innerHTML = data;
    });


    
    const canvas = document.getElementById("canvas");
    const engine = initializeEngine(canvas);
    const scene = createScene(engine);
    const camera = setupCamera(scene, canvas);
    setupLights(scene);



    
    let projectEmpties = [];
    let selectedTechTags = new Set();
    let selectedSkillTags = new Set();


    function filterProjects(projects, techTags, skillTags) {
      const spacingY = 2.8;
      let currentY = 2.6;

      projects.forEach(project => project.setEnabled(false));

      let visible = projects.filter(project => {
        const tech = (project.metadata?.tech || "").replace(/[{}]/g, '').split(',').map(t => t.trim().toLowerCase());
        const skill = (project.metadata?.skills || "").replace(/[{}]/g, '').split(',').map(t => t.trim().toLowerCase());

        //const techMatch = techTags.size === 0 || tech.some(tag => techTags.has(tag));
        const techMatch = [...techTags].every(tag => tech.includes(tag));
        const skillMatch = [...skillTags].every(tag => skill.includes(tag));


        return techMatch && skillMatch;
      });

      visible.forEach(project => {
        project.setEnabled(true);
        project.position.y = currentY;
        currentY -= spacingY;
      });
    }




    

    loadMeshes(scene, "projects.babylon").then(result => {
      //dragableMeshes, tagCubes, projectEmpties, techTagsMap, skillTagsMap
      //const { dragableMeshes, taggedGroups: tags, tagCubes, projectEmpties: empties } = result;
      const { dragableMeshes, tagCubes, projectEmpties: empties } = result;
      
      projectEmpties = empties;

     

      setupInteractions(dragableMeshes, scene);

      //Object.values(taggedGroups).flat().forEach(mesh => mesh.setEnabled(false));
      projectEmpties.forEach(mesh => mesh.setEnabled(false));





       // 👇 Setup 3D cube-tag interaction
    tagCubes.forEach(cube => {
      //.log(`Cube: ${cube.name}`, cube.metadata);
      cube.isPickable = true;
      //const tag = cube.metadata?.tags.toLowerCase();
      const tag = cube.name.split("_")[2]?.toLowerCase();
      //console.log("Cube found", tag)
      const type = cube.name.split("_")[3]?.toLowerCase(); //tech or skill
      

      cube.actionManager = new BABYLON.ActionManager(scene);
      cube.actionManager.registerAction(
        new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
          


          //const isSelected = type === 'tech' ? selectedTechTags.has(tag) : selectedSkillTags.has(tag);
          

          const tagSet = type === 'tech' ? selectedTechTags : selectedSkillTags;
          const isSelected = tagSet.has(tag);

          if (isSelected) {
            tagSet.delete(tag);
          } else {
            tagSet.add(tag);
          }










          tagCubes.forEach(c => {
              const cubeTag = c.name.split("_")[2]?.toLowerCase();
              const cubeType = c.name.split("_")[3]?.toLowerCase();
              const active = (cubeType === 'tech' && selectedTechTags.has(cubeTag)) || (cubeType === 'skill' && selectedSkillTags.has(cubeTag));


              //c.material.emissiveColor = active ? BABYLON.Color3.Teal() : BABYLON.Color3.Black();
              if (active) {
                c.scaling = new BABYLON.Vector3(1.05, 1.05, 1.05);
                c.renderOutline = true;
                c.outlineColor = BABYLON.Color3.Red();
                c.outlineWidth = 0.02;
              } else {
                c.scaling = new BABYLON.Vector3(1.0,1.0,1.0);
                c.renderOutline = false;
              }
            });

          
          cube.position.y += 0.2;

          // 🧼 Handle tag filtering
          filterProjects(projectEmpties, selectedTechTags, selectedSkillTags);
        })
      );
    });






      // Show all by default
      //filterByTag("all");
      filterProjects(projectEmpties, selectedTechTags, selectedSkillTags);
    });






    setupInputControls(scene, camera, canvas, { min: -25, max: 5 });




    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
