<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects</title>
  <link rel="stylesheet" href="./css/style.css" />

  <!-- BabylonJS -->
  <script src="https://preview.babylonjs.com/babylon.js"></script>
  <script src="https://preview.babylonjs.com/Oimo.js"></script>
  <script src="https://preview.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <style>
    .tag-buttons {
      text-align: center;
      margin: 1rem;
    }

    .tag-buttons button {
      margin: 0.3rem;
      padding: 0.5rem 1rem;
      background: #ffffff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .tag-buttons button.active {
      background: #222;
      color: rgb(0, 0, 0);
    }
  </style>


</head>

<body>
  <!-- Shared header/footer -->
  <header></header>
  
  <main>
    <canvas id="canvas"></canvas>
  </main>
  <footer></footer>

  <script type="module">
    import { initializeEngine, createScene } from './js/sceneSetup.js';
    import { setupCamera } from './js/cameraSetup.js';
    import { setupLights } from './js/lightSetup.js';
    import { setupInputControls } from './js/inputControls.js';
    import { loadMeshes } from './js/meshSetup.js';
    import { setupInteractions } from './js/interactions.js';
    //import { loadProjects } from './js/projectLoader.js'; // ✅ NEW

    // Load header & footer
    fetch("header.html").then(res => res.text()).then(data => {
      document.querySelector("header").innerHTML = data;
    });
    fetch("footer.html").then(res => res.text()).then(data => {
      document.querySelector("footer").innerHTML = data;
    });


    
    const canvas = document.getElementById("canvas");
    const engine = initializeEngine(canvas);
    const scene = createScene(engine);
    const camera = setupCamera(scene, canvas);
    setupLights(scene);



    let taggedGroups = {};
    let projectEmpties = [];


    function filterByTag(tag) {
      const spacingY = 3.5;
      let currentY = 2;

      // Hide everything first
      projectEmpties.forEach(mesh => mesh.setEnabled(false));

      // Get active group
      let toShow = [];

      if (tag === "all") {
          //toShow = Object.values(taggedGroups).flat();
          const seen = new Set();
          Object.values(taggedGroups).flat().forEach(mesh => {
            if (!seen.has(mesh)) {
              seen.add(mesh);
              toShow.push(mesh);
            }
          });
      } else if (tag !== "none" && taggedGroups[tag]) {
          toShow = taggedGroups[tag];
      }

      // Show & reposition root-level project empties
      for (const root of toShow) {
        //.log(root.name);
        if (root.name.startsWith("Empty")) {
            root.setEnabled(true);
            root.position.y = currentY;
            currentY -= spacingY;
        }
      }



      
    }




    

    loadMeshes(scene, "projects.babylon").then(result => {
      const { dragableMeshes, taggedGroups: tags, tagCubes, projectEmpties: empties } = result;
      taggedGroups = tags;
      projectEmpties = empties;

     

      setupInteractions(dragableMeshes, scene);

      //Object.values(taggedGroups).flat().forEach(mesh => mesh.setEnabled(false));
      projectEmpties.forEach(mesh => mesh.setEnabled(false));




      /*
      // 🧷 Build tag buttons dynamically
      const tagContainer = document.getElementById("tag-buttons");
      const allTags = ["all", "none", ...Object.keys(taggedGroups)];

      allTags.forEach(tag => {
        const btn = document.createElement("button");
        btn.textContent = tag.charAt(0).toUpperCase() + tag.slice(1);
        btn.dataset.tag = tag;
        btn.addEventListener("click", () => filterByTag(tag));
        tagContainer.appendChild(btn);
      });
      */

       // 👇 Setup 3D cube-tag interaction
    tagCubes.forEach(cube => {
      //.log(`Cube: ${cube.name}`, cube.metadata);
      cube.isPickable = true;
      //const tag = cube.metadata?.tags.toLowerCase();
      const tag = cube.name.split("_")[2]?.toLowerCase();
      //console.log(tag);

      cube.actionManager = new BABYLON.ActionManager(scene);
      cube.actionManager.registerAction(
        new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
          // 🔄 Reset visuals of all cubes
          tagCubes.forEach(c => {
            const isSelected = c === cube;
            
            // Emissive highlight or none
            c.material.emissiveColor = isSelected ? BABYLON.Color3.Teal() : BABYLON.Color3.Black();

            


            //c.material.emissiveColor = BABYLON.Color3.Black();
            //c.position.y += 0.1; // reset to unpressed
          });

          // 🎯 Highlight clicked cube
          //cube.material.emissiveColor = BABYLON.Color3.Teal();
          cube.position.y += 0.1;

          // 🧼 Handle tag filtering
          if (tag && taggedGroups[tag]) {
            filterByTag(tag);
          }
        })
      );
    });






      // Show all by default
      filterByTag("all");
    });






    setupInputControls(scene, camera, canvas, { min: -16, max: 16 });




    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
