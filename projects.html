<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects</title>
  <link rel="stylesheet" href="./css/style.css" />

  <!-- BabylonJS -->
  <script src="https://preview.babylonjs.com/babylon.js"></script>
  <script src="https://preview.babylonjs.com/Oimo.js"></script>
  <script src="https://preview.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <style>
    .tag-buttons {
      text-align: center;
      margin: 1rem;
    }

    .tag-buttons button {
      margin: 0.3rem;
      padding: 0.5rem 1rem;
      background: #ffffff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .tag-buttons button.active {
      background: #222;
      color: rgb(0, 0, 0);
    }
  </style>


</head>

<body>
  <!-- Shared header/footer -->
  <header></header>
  <div class="tag-buttons" id="tag-buttons"></div>
  <main>
    <canvas id="canvas"></canvas>
  </main>
  <footer></footer>

  <script type="module">
    import { initializeEngine, createScene } from './js/sceneSetup.js';
    import { setupCamera } from './js/cameraSetup.js';
    import { setupLights } from './js/lightSetup.js';
    import { setupInputControls } from './js/inputControls.js';
    import { loadMeshes } from './js/meshSetup.js';
    import { setupInteractions } from './js/interactions.js';
    //import { loadProjects } from './js/projectLoader.js'; // ✅ NEW

    // Load header & footer
    fetch("header.html").then(res => res.text()).then(data => {
      document.querySelector("header").innerHTML = data;
    });
    fetch("footer.html").then(res => res.text()).then(data => {
      document.querySelector("footer").innerHTML = data;
    });

    const canvas = document.getElementById("canvas");
    const engine = initializeEngine(canvas);
    const scene = createScene(engine);
    const camera = setupCamera(scene, canvas);
    setupLights(scene);

    let taggedGroups = {};


    function filterByTag(tag) {
      Object.entries(taggedGroups).forEach(([key, groups]) => {
        groups.forEach(mesh => mesh.setEnabled(false));
      });

      if (tag === "all") {
        Object.values(taggedGroups).flat().forEach(mesh => mesh.setEnabled(true));
      } else if (tag !== "none" && taggedGroups[tag]) {
        taggedGroups[tag].forEach(mesh => mesh.setEnabled(true));
    }

      // Highlight active button
      document.querySelectorAll(".tag-buttons button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tag === tag);
      });
    }



    // ✅ Load project cards from JSON + Blender template
    //await loadProjects(scene);
    /*
    loadMeshes(scene, "projects.babylon").then((meshes) => {
      setupInteractions(meshes, scene);
      
    });
    */

    loadMeshes(scene, "projects.babylon").then(result => {
      const { dragableMeshes, taggedGroups: tags } = result;
      taggedGroups = tags;

     

      setupInteractions(dragableMeshes, scene);

       Object.values(taggedGroups).flat().forEach(mesh => mesh.setEnabled(false));

      // 🧷 Build tag buttons dynamically
      const tagContainer = document.getElementById("tag-buttons");
      const allTags = ["all", "none", ...Object.keys(taggedGroups)];

      allTags.forEach(tag => {
        const btn = document.createElement("button");
        btn.textContent = tag.charAt(0).toUpperCase() + tag.slice(1);
        btn.dataset.tag = tag;
        btn.addEventListener("click", () => filterByTag(tag));
        tagContainer.appendChild(btn);
      });

      // Show all by default
      filterByTag("all");
    });






    setupInputControls(scene, camera, canvas, { min: -16, max: 5 });




    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
